name: test
on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure jq
        run: command -v jq >/dev/null || sudo apt-get install -y jq
      - name: Run tests
        run: bash tests/run.sh
